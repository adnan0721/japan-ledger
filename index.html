<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅費帳本</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅費帳本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17212e; --muted:#6b7686; --line:#e1e6ed;
  --accent:#1f3a5f; --accent-fg:#ffffff; --seal:#c8372d; --soft:#e6edf7; --warn:#b26a00;
  --font:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f151d; --surface:#18212c; --fg:#e8edf4; --muted:#93a0b2; --line:#2a3644;
  --accent:#8fb2e8; --accent-fg:#0f151d; --seal:#ef6a5f; --soft:#22324a; --warn:#e5a24a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);padding:env(safe-area-inset-top,0px) 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;align-items:center;padding-block:12px}
.proj{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.proj b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.proj small{color:var(--muted);margin-left:auto;white-space:nowrap}
.ibtn{min-width:56px;height:44px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;position:relative}
.ibtn.off::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sum{background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:18px;display:grid;gap:4px}
.sum .lbl{font-size:12px;opacity:.8;letter-spacing:.08em}
.sum .big{font-size:34px;font-weight:700;line-height:1.1}
.sum .row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9;margin-top:6px}
.sum .meta{font-size:13px;opacity:.9}
.sum .memo{font-size:12px;opacity:.75;white-space:pre-wrap;overflow-wrap:anywhere}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip span{color:var(--muted);margin-left:4px}
.day{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:14px 4px 6px}
.group{border-radius:12px;overflow:hidden;background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--line)}
.group .item:last-child{border-bottom:0}
.tag{flex:none;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.item .t{flex:1;min-width:0}.item .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{text-align:right;font-weight:500}.item .a small{display:block;color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;padding-inline:22px;border-radius:28px;background:var(--seal);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:17px}
.sheet h3{margin:0;font-size:13px;color:var(--muted);font-weight:500}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1.5;resize:vertical;font-family:inherit}
input,select{width:100%;min-width:0;height:46px;padding-inline:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.amt{font-size:28px;font-weight:700;height:58px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two>label{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;padding-inline:10px;font-size:15px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:46px;padding-inline:16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:none;color:var(--seal);border:1px solid var(--seal)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.pl{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.pl.on{border-color:var(--accent);background:var(--soft)}
.pl div{flex:1;min-width:0}.pl small{color:var(--muted);display:block}
.pl .w{color:var(--warn)}
.hint{font-size:12px;color:var(--muted);margin:0}
.status{display:flex;gap:8px;align-items:center;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.on{background:#2f9d63}
.ver{text-align:center;color:var(--muted);font-size:12px;padding-top:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var CATS=[["餐飲","食"],["交通","行"],["住宿","宿"],["購物","買"],["景點","遊"],["其他","他"]];
var PAYS=["現金","信用卡","IC卡","行動支付"];
var VERSION="v9";
var KEY="jp-ledger-v1", CID_KEY="jp-ledger-gclient", FOLDER_KEY="jp-ledger-folder";
var SCOPE="https://www.googleapis.com/auth/drive.file";
var mem=null;
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function newProject(name){return {id:uid(),name:name,rate:0.21,createdAt:Date.now(),updatedAt:Date.now(),expenses:[]}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(){
  try{var s=lsGet(KEY);if(s){var o=JSON.parse(s);if(o&&o.projects&&o.projects.length)return o}}catch(e){}
  var p=newProject("東京 5 日遊"),t=today();
  p.expenses=[
    {id:uid(),date:t,amount:1280,cat:"餐飲",pay:"現金",note:"範例：拉麵"},
    {id:uid(),date:t,amount:220,cat:"交通",pay:"IC卡",note:"範例：山手線"},
    {id:uid(),date:t,amount:3980,cat:"購物",pay:"信用卡",note:"範例：藥妝店"}];
  return {current:p.id,projects:[p]};
}
var S=load();
function save(){lsSet(KEY,JSON.stringify(S))}
function cur(){return S.projects.find(function(p){return p.id===S.current})||S.projects[0]}
function touch(){cur().updatedAt=Date.now();save()}
var ui={cat:"全部",sheet:null,editId:null,confirmDel:false,cloud:null,msg:"",busy:false};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yen(n){return "¥"+Math.round(n).toLocaleString("en-US")}
function twd(n,r){return "NT$"+Math.round(n*r).toLocaleString("en-US")}
function fmtT(t){return new Date(t).toLocaleString("zh-TW",{hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function folderName(){return (lsGet(FOLDER_KEY)||"").trim()||"旅費帳本"}
function cid(){return (lsGet(CID_KEY)||"").trim()}

function render(){
  var p=cur(),ex=p.expenses.slice().sort(function(a,b){if(a.date!==b.date)return a.date<b.date?1:-1;var ta=a.time||'',tb=b.time||'';if(ta!==tb)return ta<tb?1:-1;return b.id>a.id?1:-1});
  var total=ex.reduce(function(s,e){return s+e.amount},0);
  var td=today(),tdSum=ex.filter(function(e){return e.date===td}).reduce(function(s,e){return s+e.amount},0);
  var days=new Set(ex.map(function(e){return e.date})).size;
  var by={};ex.forEach(function(e){by[e.cat]=(by[e.cat]||0)+e.amount});
  var list=ui.cat==="全部"?ex:ex.filter(function(e){return e.cat===ui.cat});
  var h='<div class="bar"><button class="proj" data-a="projects" aria-label="切換專案"><b>'+esc(p.name)+'</b><small>切換 ▾</small></button><button class="ibtn'+(navigator.onLine?'':' off')+'" data-a="sync">同步</button></div>';
  h+='<section class="sum"><div class="lbl">總支出</div><div class="big num">'+yen(total)+'</div><div class="row num"><span>約 '+twd(total,p.rate)+'</span><span>今日 '+yen(tdSum)+'</span>'+(days?'<span>日均 '+yen(total/days)+'</span>':'')+'</div>'+extraHTML(p,total)+'</section>';
  h+='<div class="cats"><button class="chip" data-cat="全部" aria-pressed="'+(ui.cat==="全部")+'">全部</button>'+CATS.map(function(c){return '<button class="chip" data-cat="'+c[0]+'" aria-pressed="'+(ui.cat===c[0])+'">'+c[0]+(by[c[0]]?'<span class="num">'+yen(by[c[0]])+'</span>':'')+'</button>'}).join("")+'</div>';
  if(!list.length)h+='<div class="empty">還沒有記錄<br>點右下角「記一筆」開始</div>';
  else{
    var groups=[],g=null;
    list.forEach(function(e){if(!g||g.d!==e.date){g={d:e.date,items:[]};groups.push(g)}g.items.push(e)});
    groups.forEach(function(g){
      var s=g.items.reduce(function(a,e){return a+e.amount},0);
      h+='<div class="day num"><span>'+g.d+(g.d===td?"（今天）":"")+'</span><span>'+yen(s)+'</span></div><div class="group">';
      g.items.forEach(function(e){
        var c=CATS.find(function(x){return x[0]===e.cat})||CATS[5];
        h+='<button class="item" data-edit="'+e.id+'"><span class="tag">'+c[1]+'</span><span class="t"><div>'+esc(e.note||e.cat)+'</div><small class="num">'+(e.time?esc(e.time)+' · ':'')+(e.place?esc(e.place)+' · ':'')+esc(e.cat)+' · '+esc(e.pay)+'</small></span><span class="a num">'+yen(e.amount)+'<small>'+twd(e.amount,p.rate)+'</small></span></button>';
      });
      h+='</div>';
    });
  }
  h+='<div class="ver">版本 '+VERSION+'</div><button class="fab" data-a="add">＋ 記一筆</button>';
  h+=sheetHTML(p);
  $("#app").innerHTML=h;
}

function md(d){return d?d.slice(5).replace('-','/'):''}
function extraHTML(p,total){
  var h='',m=[];
  if(p.start||p.end)m.push(md(p.start)+(p.end?' – '+md(p.end):''));
  if(m.length)h+='<div class="meta num">'+esc(m.join('　·　'))+'</div>';
  if(p.memo)h+='<div class="memo">'+esc(p.memo)+'</div>';
  return h;
}
function sheetHTML(p){
  if(!ui.sheet)return "";
  var b='';
  if(ui.sheet==="form"){
    var e=ui.editId?p.expenses.find(function(x){return x.id===ui.editId}):null;
    var v=e||{date:today(),time:nowT(),amount:"",cat:"餐飲",pay:"現金",note:""};
    b='<h2>'+(e?"編輯支出":"記一筆")+'</h2>'+
    '<label>金額（日圓）<input id="f-amt" class="amt num" type="number" inputmode="numeric" min="0" placeholder="0" value="'+esc(v.amount)+'"></label>'+
    '<div id="f-twd" class="hint num"></div>'+
    '<div><h3>類別</h3><div class="seg">'+CATS.map(function(c){return '<button class="chip" type="button" data-fcat="'+c[0]+'" aria-pressed="'+(v.cat===c[0])+'">'+c[0]+'</button>'}).join("")+'</div></div>'+
    '<div class="two"><label>日期<input id="f-date" type="date" value="'+v.date+'"></label><label>時間<input id="f-time" type="time" value="'+esc(v.time||"")+'"></label></div>'+
    '<label>付款方式<select id="f-pay">'+PAYS.map(function(x){return '<option'+(x===v.pay?' selected':'')+'>'+x+'</option>'}).join("")+'</select></label>'+
 '<label>地點<input id="f-place" type="text" list="places" placeholder="例如：淺草、新宿站" value="'+esc(v.place||"")+'"></label><datalist id="places">'+placeList().map(function(x){return '<option value="'+esc(x)+'">'}).join("")+'</datalist>'+
    '<label>備註<input id="f-note" type="text" placeholder="例如：一蘭拉麵" value="'+esc(v.note)+'"></label>'+
    '<div class="btns">'+(e?'<button class="btn danger" data-a="del">'+(ui.confirmDel?"再按一次刪除":"刪除")+'</button>':'<button class="btn ghost" data-a="close">取消</button>')+'<button class="btn" data-a="saveExp">儲存</button></div>';
  }else if(ui.sheet==="projects"){
    b='<h2>切換專案</h2>'+S.projects.map(function(q){
      var t=q.expenses.reduce(function(s,e){return s+e.amount},0);
      return '<button class="pl'+(q.id===p.id?' on':'')+'" data-proj="'+q.id+'"><div><b>'+esc(q.name)+'</b><small class="num">'+q.expenses.length+' 筆 · '+yen(t)+'</small></div>'+(q.id===p.id?'<span>✓</span>':'')+'</button>';
    }).join("")+
    '<h3>新增旅行專案</h3><div class="btns"><input id="np-name" type="text" placeholder="例如：大阪京都 2026 春"><button class="btn" data-a="newProj" style="flex:none">建立</button></div>'+
    '<h3>目前專案設定</h3><div class="two"><label>專案名稱<input id="ps-name" type="text" value="'+esc(p.name)+'"></label><label>匯率（日圓→台幣）<input id="ps-rate" type="number" inputmode="decimal" step="0.001" value="'+p.rate+'"></label></div>'+
    '<div class="two"><label>出發日<input id="ps-start" type="date" value="'+esc(p.start||"")+'"></label><label>回程日<input id="ps-end" type="date" value="'+esc(p.end||"")+'"></label></div>'+
    '<label>備註（住宿、航班、行程重點等，可多行）<textarea id="ps-memo" rows="4">'+esc(p.memo||"")+'</textarea></label>'+
    '<div class="btns"><button class="btn ghost" data-a="saveSet">更新設定</button><button class="btn danger" data-a="delProj">'+(ui.confirmDel?"再按一次確認":"刪除此專案")+'</button></div>';
  }else if(ui.sheet==="sync"){
    var on=navigator.onLine,ready=on&&!!cid()&&!ui.busy;
    b='<h2>同步與備份</h2>'+
    '<div class="status"><span class="dot'+(on?' on':'')+'"></span>'+(on?'已連線':'離線中，記帳不受影響；同步需要網路')+'</div>'+
    '<p class="hint">資料平常只存在這支手機。同步由你手動按，不會自動覆蓋。</p>'+
    '<h3>目前專案：'+esc(p.name)+'</h3>'+
    '<div class="btns"><button class="btn" data-a="up"'+(ready?'':' disabled')+'>上傳到 Google 雲端</button><button class="btn ghost" data-a="listCloud"'+(ready?'':' disabled')+'>下載其他專案</button></div>'+
    (ui.msg?'<p class="hint">'+esc(ui.msg)+'</p>':'')+
    (ui.cloud?(ui.cloud.length?ui.cloud.map(function(c){
      var loc=S.projects.find(function(x){return x.id===c.pid});
      var newer=loc&&loc.updatedAt>c.u;
      return '<button class="pl" data-down="'+c.id+'"><div><b>'+esc(c.pname)+'</b><small class="num">'+c.n+' 筆 · 雲端 '+fmtT(c.u)+(loc?' · 手機 '+fmtT(loc.updatedAt):'')+'</small>'+(newer?'<small class="w">手機版本較新，下載會覆蓋手機上的內容</small>':'')+'</div><span>下載</span></button>';
    }).join(""):'<p class="hint">雲端還沒有專案。</p>'):'')+
    '<label>Google OAuth 用戶端 ID（只需設定一次，步驟見 README）<input id="cid" type="text" autocomplete="off" autocapitalize="off" placeholder="xxxx.apps.googleusercontent.com" value="'+esc(cid())+'"></label>'+
    '<label>雲端資料夾名稱（首次上傳時建立，之後可在雲端硬碟改名或搬移，App 會自動找到）<input id="fname" type="text" value="'+esc(folderName())+'"></label>'+
    '<button class="btn ghost" data-a="saveCid">儲存設定</button>'+
    '<h3>程式版本</h3><div class="btns" style="align-items:center"><span class="num" style="flex:1">目前版本 '+VERSION+'</span><button class="btn ghost" data-a="update">更新到最新版</button></div>'+
    '<h3>備份與匯出</h3>'+
    '<div class="btns"><button class="btn ghost" data-a="share">分享備份</button><button class="btn ghost" data-a="csv">匯出 Excel</button></div>'+
    '<div class="btns"><button class="btn ghost" data-a="export">下載備份檔</button><button class="btn ghost" data-a="import">匯入備份檔</button></div>'+
    '<input id="imp" type="file" accept=".json,application/json" hidden>'+
    '<button class="btn ghost" data-a="close">關閉</button>';
  }
  return '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog">'+b+'</div></div>';
}

function placeList(){var m={};S.projects.forEach(function(q){q.expenses.forEach(function(e){if(e.place)m[e.place]=(m[e.place]||0)+1})});return Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,30)}
function open(s,id){ui.sheet=s;ui.editId=id||null;ui.confirmDel=false;render();if(s==="form")updTwd()}
function close(){ui.sheet=null;ui.editId=null;ui.confirmDel=false;render()}
function updTwd(){var a=$("#f-amt"),t=$("#f-twd");if(a&&t){var n=+a.value||0;t.textContent=n?"約 "+twd(n,cur().rate):""}}
function mergeIn(p){
  var i=S.projects.findIndex(function(x){return x.id===p.id});
  if(i>=0)S.projects[i]=p;else S.projects.push(p);
  S.current=p.id;save();
}
function validProject(p){return p&&typeof p.id==="string"&&typeof p.name==="string"&&Array.isArray(p.expenses)}

/* ---- Google Drive（只在按同步時才連網）---- */
var gsiP=null,tok=null,tokExp=0;
function loadGsi(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  if(!gsiP)gsiP=new Promise(function(res,rej){
    var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";
    s.onload=res;s.onerror=function(){gsiP=null;rej(new Error("無法載入 Google 登入，請確認網路"))};
    document.head.appendChild(s);
  });
  return gsiP;
}
function getToken(){
  if(tok&&Date.now()<tokExp-60000)return Promise.resolve(tok);
  return loadGsi().then(function(){return new Promise(function(res,rej){
    var c=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE,
      callback:function(r){if(r.error)rej(new Error(r.error_description||r.error));else{tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;res(tok)}},
      error_callback:function(e){rej(new Error(e&&e.type==="popup_closed"?"已取消登入":"登入失敗（"+(e&&e.type||"未知")+"）"))}});
    c.requestAccessToken();
  })});
}
function drive(url,opt){
  return getToken().then(function(t){
    opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+t},opt.headers||{});
    return fetch(url,opt);
  }).then(function(r){
    if(!r.ok)return r.text().then(function(x){throw new Error("Google 回應 "+r.status+(r.status===403||r.status===401?"，請確認已啟用 Drive API 並將帳號加入測試使用者":""))});
    return r;
  });
}
function listCloud(){
  var q=encodeURIComponent("appProperties has { key='jpledger' and value='1' } and trashed=false");
  return drive("https://www.googleapis.com/drive/v3/files?q="+q+"&fields="+encodeURIComponent("files(id,parents,appProperties)")+"&pageSize=100").then(function(r){return r.json()}).then(function(j){
    return (j.files||[]).map(function(f){var a=f.appProperties||{};return {id:f.id,parents:f.parents||[],pid:a.pid,pname:a.pname||"(未命名)",n:+a.n||0,u:+a.u||0}});
  });
}
function ensureFolder(){
  var base="https://www.googleapis.com/drive/v3/files";
  var q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and appProperties has { key='jpfolder' and value='1' } and trashed=false");
  return drive(base+"?q="+q+"&fields="+encodeURIComponent("files(id)")).then(function(r){return r.json()}).then(function(j){
    if(j.files&&j.files.length)return j.files[0].id;
    return drive(base+"?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:folderName(),mimeType:"application/vnd.google-apps.folder",appProperties:{jpfolder:"1"}})}).then(function(r){return r.json()}).then(function(f){return f.id});
  });
}
function uploadProject(p){
  return Promise.all([listCloud(),ensureFolder()]).then(function(res){
    var ex=res[0].find(function(f){return f.pid===p.id}),folder=res[1];
    var meta={name:"旅費帳本-"+p.name+".json",mimeType:"application/json",appProperties:{jpledger:"1",pid:p.id,pname:p.name.slice(0,60),n:String(p.expenses.length),u:String(p.updatedAt)}};
    if(!ex)meta.parents=[folder];
    var B="jpl"+uid(),body="--"+B+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+"\r\n--"+B+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(p)+"\r\n--"+B+"--";
    var url="https://www.googleapis.com/upload/drive/v3/files"+(ex?"/"+ex.id:"")+"?uploadType=multipart";
    if(ex){url+="&addParents="+folder;var rm=ex.parents.filter(function(x){return x!==folder});if(rm.length)url+="&removeParents="+rm.join(",")}
    return drive(url,{method:ex?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+B},body:body});
  });
}
function saveFile(name,mime,text,share){
  name=name.replace(/[\\/:*?"<>|]/g,"_");
  var file=new File([text],name,{type:mime});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(function(e){if(e&&e.name!=="AbortError")dl()});return;
  }
  dl();
  function dl(){var u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast("已匯出")}
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-a],[data-cat],[data-edit],[data-proj],[data-down],[data-fcat]");
  if(!el||el.disabled)return;
  var a=el.dataset.a,p=cur();
  if(a==="scrim"){if(ev.target===el)close();return}
  if(el.dataset.cat){ui.cat=el.dataset.cat;render();return}
  if(el.dataset.edit){open("form",el.dataset.edit);return}
  if(el.dataset.fcat){document.querySelectorAll("[data-fcat]").forEach(function(b){b.setAttribute("aria-pressed",b===el)});return}
  if(el.dataset.proj){S.current=el.dataset.proj;ui.cat="全部";save();close();return}
  if(el.dataset.down){
    ui.busy=true;ui.msg="下載中…";render();
    drive("https://www.googleapis.com/drive/v3/files/"+el.dataset.down+"?alt=media").then(function(r){return r.json()}).then(function(o){
      if(!validProject(o))throw new Error("雲端檔案格式不正確");
      mergeIn(o);ui.cat="全部";ui.busy=false;close();toast("已下載「"+o.name+"」");
    }).catch(function(e){ui.busy=false;ui.msg="下載失敗："+e.message;render()});
    return}
  if(a==="add")open("form");
  else if(a==="projects")open("projects");
  else if(a==="sync"){ui.cloud=null;ui.msg=cid()?"":"請先在下方填入 Google OAuth 用戶端 ID。";open("sync");if(navigator.onLine&&cid())loadGsi().catch(function(){})}
  else if(a==="close")close();
  else if(a==="saveCid"){lsSet(CID_KEY,$("#cid").value.trim());lsSet(FOLDER_KEY,$("#fname").value.trim());tok=null;ui.msg="已儲存設定";render();if(navigator.onLine)loadGsi().catch(function(){})}
  else if(a==="saveExp"){
    var amt=Math.round(+$("#f-amt").value);
    if(!(amt>0)){toast("請輸入金額");return}
    var ce=document.querySelector('[data-fcat][aria-pressed="true"]');
    var rec={id:ui.editId||uid(),date:$("#f-date").value||today(),time:$("#f-time").value||"",place:$("#f-place").value.trim(),amount:amt,cat:ce?ce.dataset.fcat:"其他",pay:$("#f-pay").value,note:$("#f-note").value.trim()};
    if(ui.editId)p.expenses=p.expenses.map(function(x){return x.id===ui.editId?rec:x});else p.expenses.push(rec);
    touch();close();toast("已儲存");
  }
  else if(a==="del"){
    if(!ui.confirmDel){ui.confirmDel=true;render();updTwd();return}
    p.expenses=p.expenses.filter(function(x){return x.id!==ui.editId});touch();close();toast("已刪除");
  }
  else if(a==="newProj"){
    var n=$("#np-name").value.trim();if(!n){toast("請輸入專案名稱");return}
    var q=newProject(n);S.projects.push(q);S.current=q.id;ui.cat="全部";save();close();
  }
  else if(a==="saveSet"){
    var nm=$("#ps-name").value.trim(),r=+$("#ps-rate").value;
    if(nm)p.name=nm;if(r>0)p.rate=r;p.start=$("#ps-start").value;p.end=$("#ps-end").value;p.memo=$("#ps-memo").value.trim();touch();close();toast("已更新");
  }
  else if(a==="delProj"){
    if(!ui.confirmDel){ui.confirmDel=true;render();return}
    S.projects=S.projects.filter(function(x){return x.id!==p.id});
    if(!S.projects.length)S.projects.push(newProject("新旅行"));
    S.current=S.projects[0].id;save();close();toast("已刪除專案");
  }
  else if(a==="up"){
    ui.busy=true;ui.msg="上傳中…";render();
    uploadProject(p).then(function(){ui.busy=false;ui.msg="已上傳「"+p.name+"」（"+p.expenses.length+" 筆）";render()})
      .catch(function(e){ui.busy=false;ui.msg="上傳失敗："+e.message;render()});
  }
  else if(a==="listCloud"){
    ui.busy=true;ui.msg="讀取中…";render();
    listCloud().then(function(l){ui.busy=false;ui.cloud=l.sort(function(x,y){return y.u-x.u});ui.msg="";render()})
      .catch(function(e){ui.busy=false;ui.msg="讀取失敗："+e.message;render()});
  }
  else if(a==="update"){
    if(!navigator.onLine){toast("需要網路才能更新");return}
    toast("更新中…");
    var go=function(){location.reload()};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}):Promise.resolve())
      .then(function(){return window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}):0}).then(go,go);
  }
  else if(a==="export"){saveFile(p.name+".json","application/json",JSON.stringify(p,null,1),false)}
  else if(a==="share"){saveFile(p.name+"-"+today()+".json","application/json",JSON.stringify(p,null,1),true)}
  else if(a==="csv"){
    var q2=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var rows=[["日期","時間","地點","類別","備註","付款方式","金額(日圓)","約合台幣"]];
    p.expenses.slice().sort(function(x,y){return x.date!==y.date?(x.date<y.date?-1:1):((x.time||"")<(y.time||"")?-1:(x.time||"")>(y.time||"")?1:0)}).forEach(function(e){rows.push([e.date,e.time||"",e.place||"",e.cat,e.note,e.pay,e.amount,Math.round(e.amount*p.rate)])});
    var tot=p.expenses.reduce(function(s2,e){return s2+e.amount},0);
    rows.push(["合計","","","","","",tot,Math.round(tot*p.rate)]);
    saveFile(p.name+"-"+today()+".csv","text/csv","\ufeff"+rows.map(function(r){return r.map(q2).join(",")}).join("\r\n"),true);
  }
  else if(a==="import"){var f=$("#imp");f.onchange=function(){
    var file=f.files[0];if(!file)return;var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!validProject(o))throw 0;mergeIn(o);close();toast("已匯入「"+o.name+"」")}catch(e){toast("檔案格式不正確")}};
    rd.readAsText(file)};f.click()}
});
document.addEventListener("input",function(ev){if(ev.target.id==="f-amt")updTwd()});
function netChange(){if(ui.sheet!=="form"&&ui.sheet!=="projects")render()}
window.addEventListener("online",netChange);window.addEventListener("offline",netChange);
if("serviceWorker" in navigator){var hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtl&&!ui.sheet)location.reload();hadCtl=true})}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
render();
})();
</script>
